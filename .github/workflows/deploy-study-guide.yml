name: Deploy study guide to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'study-guide/**'
      - '.github/workflows/deploy-study-guide.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: study-guide/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: study-guide
      - name: Build study guide
        run: npm run build
        working-directory: study-guide
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload study guide
        uses: actions/upload-pages-artifact@v4
        with:
          path: study-guide/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
